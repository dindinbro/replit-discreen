services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: discreen
      POSTGRES_PASSWORD: discreen
      POSTGRES_DB: discreen
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discreen"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://discreen:discreen@postgres:5432/discreen
      NODE_ENV: production
      PORT: 5000
      # Kill switch for data-dump search, sensitive external sources,
      # payments and person-lookup features. See server/sensitive-guard.ts.
      ENABLE_SENSITIVE_FEATURES: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
